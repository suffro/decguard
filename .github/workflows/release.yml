# Pushing a vX.Y.Z tag is the release: build and validate once, publish exactly those
# distributions to PyPI (Trusted Publishing), then create the GitHub Release.
# Procedure and one-time setup: CONTRIBUTING.md#releasing.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.18"

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      sha256sums: ${{ steps.dist.outputs.sha256sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag against the package version
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ] || fail "not a tag push"
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || fail "$TAG is not a release tag (expected vX.Y.Z)"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          [ "${TAG#v}" = "$version" ] || fail "tag $TAG does not match pyproject.toml version $version"
          grep -q -F "## [$version] - " CHANGELOG.md || fail "CHANGELOG.md has no [$version] section"
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || fail "checkout is not $GITHUB_SHA"
          [ "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$GITHUB_SHA" ] \
            || fail "tag $TAG does not point to $GITHUB_SHA"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Refuse before anything reaches PyPI (read-only token, this step only).
      - name: Check the remote tag and that no release exists yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          remote=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          [ "$remote" = "$GITHUB_SHA" ] || fail "tag $TAG now points to $remote, not $GITHUB_SHA"
          if out=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url 2>&1); then
            fail "a GitHub Release for $TAG already exists: $out"
          elif [[ "$out" != *"release not found"* ]]; then
            fail "cannot check for an existing release: $out"
          fi

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          enable-cache: false

      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

      - name: Build the wheel and sdist
        id: dist
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) uv build --no-sources
          expected=$(printf '%s\n' "decguard-$VERSION-py3-none-any.whl" "decguard-$VERSION.tar.gz" | sort)
          # uv build also writes dist/.gitignore, which is not uploaded.
          actual=$(find dist -mindepth 1 ! -name .gitignore -printf '%f\n' | sort)
          [ "$actual" = "$expected" ] || { echo "::error::unexpected files in dist/: $actual"; exit 1; }
          uvx --from 'twine==7.0.0' twine check --strict dist/*.whl dist/*.tar.gz
          uv build --wheel --out-dir "$RUNNER_TEMP/from-sdist" "dist/decguard-$VERSION.tar.gz"
          sums=$(cd dist && sha256sum -- *.whl *.tar.gz)
          echo "$sums"
          { echo '```'; echo "$sums"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "sha256sums=$(echo "$sums" | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Install the wheel in a clean environment and run it
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/clean"
          uv pip install --python "$RUNNER_TEMP/clean/bin/python" "dist/decguard-$VERSION-py3-none-any.whl"
          contract="$GITHUB_WORKSPACE/examples/refund/decguard.yaml"
          cd "$RUNNER_TEMP"
          [ "$(clean/bin/decguard --version)" = "decguard $VERSION" ]
          clean/bin/decguard validate "$contract"
          clean/bin/decguard test "$contract" --output report.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/decguard/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # Trusted Publishing and attestations; nothing else
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Check these are the distributions that were validated
        env:
          SHA256SUMS: ${{ needs.build.outputs.sha256sums }}
        run: |
          cd dist
          echo "$SHA256SUMS" | base64 -d | sha256sum --check --strict
          [ "$(find . -mindepth 1 | wc -l)" -eq 2 ]

      # Trusted Publishing (OIDC): no PyPI token or password; attestations are on by default.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: Create the GitHub Release
    needs: [build, publish]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Check these are the distributions that were published
        env:
          SHA256SUMS: ${{ needs.build.outputs.sha256sums }}
        run: |
          cd dist
          echo "$SHA256SUMS" | base64 -d | sha256sum --check --strict
          [ "$(find . -mindepth 1 | wc -l)" -eq 2 ]

      - name: Create the release for the existing tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          remote=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          [ "$remote" = "$GITHUB_SHA" ] || fail "tag $TAG now points to $remote, not $GITHUB_SHA"
          if out=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url 2>&1); then
            fail "a GitHub Release for $TAG already exists: $out"
          elif [[ "$out" != *"release not found"* ]]; then
            fail "cannot check for an existing release: $out"
          fi
          gh release create "$TAG" dist/*.whl dist/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
