name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
      - name: Install the wheel in a clean environment and run an example
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          /tmp/clean/bin/decguard --version
          /tmp/clean/bin/decguard validate examples/refund/decguard.yaml
          /tmp/clean/bin/decguard test examples/refund/decguard.yaml --output report.json
          /tmp/clean/bin/decguard test examples/refund/decguard.yaml --all
          # A declared property violation must fail CI (exit 1), and replay must reproduce it.
          set +e
          /tmp/clean/bin/decguard fuzz examples/refund/decguard.yaml -b order_sensitive --output fuzz.json
          fuzz_code=$?
          /tmp/clean/bin/decguard replay fuzz.json
          replay_code=$?
          set -e
          test "$fuzz_code" -eq 1 && test "$replay_code" -eq 1
          /tmp/clean/bin/decguard diff report.json report.json --contract examples/refund/decguard.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
