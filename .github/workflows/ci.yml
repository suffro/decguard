name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
      - name: Install the wheel in a clean environment and run an example
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          /tmp/clean/bin/decguard --version
          /tmp/clean/bin/decguard validate examples/refund/decguard.yaml
          /tmp/clean/bin/decguard test examples/refund/decguard.yaml --output report.json
          /tmp/clean/bin/decguard test examples/refund/decguard.yaml --all
          # Property, calibration, regression and production drift failures must exit 1.
          set +e
          /tmp/clean/bin/decguard fuzz examples/refund/decguard.yaml -b order_sensitive --output fuzz.json
          fuzz_code=$?
          /tmp/clean/bin/decguard replay fuzz.json
          replay_code=$?
          /tmp/clean/bin/decguard test examples/refund/decguard.yaml -b order_sensitive --output candidate.json
          calibration_code=$?
          /tmp/clean/bin/decguard diff report.json candidate.json --contract examples/refund/decguard.yaml --output diff.json
          diff_code=$?
          /tmp/clean/bin/decguard check examples/refund/decguard.yaml \
            --dataset examples/refund/production-drift.jsonl \
            --baseline examples/refund/production.jsonl \
            --output drift-report.json
          drift_code=$?
          set -e
          test "$fuzz_code" -eq 1
          test "$replay_code" -eq 1
          test "$calibration_code" -eq 1
          test "$diff_code" -eq 1
          test "$drift_code" -eq 1
          /tmp/clean/bin/decguard diff report.json report.json --contract examples/refund/decguard.yaml
          /tmp/clean/bin/decguard check examples/refund/decguard.yaml --dataset examples/refund/production.jsonl --output production-report.json
          /tmp/clean/bin/decguard run examples/refund/decguard.yaml "The blender arrived damaged"
          /tmp/clean/bin/decguard run examples/refund/decguard.yaml "The parcel never arrived"
          /tmp/clean/bin/decguard run examples/refund/decguard.yaml "Can someone call me?"
          /tmp/clean/bin/python - <<'PY'
          from decguard import DecGuard

          with DecGuard.from_contract("examples/refund/decguard.yaml") as guard:
              assert guard.decide("The blender arrived damaged").action == "accept"
              fallback = guard.decide("The parcel never arrived")
              assert (fallback.action, fallback.fallback_backend) == ("fallback", "strong_model")
              assert guard.decide("Can someone call me?").action == "human_review"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
